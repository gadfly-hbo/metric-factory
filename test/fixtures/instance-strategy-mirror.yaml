# A2 T4 镜像 fixture：与评审原型 strategy 预设逐区块同构（oracle v02/v05/v06 对照用）
# 同构约定：零指标（战略定性设计）· questions 3（metric_refs 全空）· hypotheses 2 · evidence 3
# · options 3 · 1 定性场景（strategic-options-comparison，无角色绑定）。
instance:
  created_at: "2026-10-18T00:00:00.000Z"
added: []
added_scenarios:
  - id: strategic_options
    version: 0.1.0
    title: 战略选项与情景比较
    decision_purpose: 继续扩店、建设供应链或投入会员经营，哪些选择在什么条件下成立？
    question_tree:
      - id: n1
        label: 明确候选道路与取舍边界
      - id: n2
        label: 比较客户、竞争和能力依据
    metric_usages: []
    method_refs:
      - strategic-options-comparison@0.1.0
blueprint:
  title: 零售增长路径分析体系
  intent: 设计具体分析方案
  purpose: 比较继续扩店、供应链建设与会员经营的长期投入依据，而非仅追求某个规模目标。
  decision: 未来资源优先投入哪条增长道路，以及应减少或放弃哪些投入？
  boundary: 先设计比较与验证，不批准资源，不从一个季度的利润变化判定战略失败。
  deliverable: 战略选项、选择依据、关键假设、主要风险与重新审视条件。
  contexts:
    - 战略选择
  organizations:
    - 假设先行
    - 深度研究
  questions:
    - id: q1
      title: 哪类客户值得持续服务？
      detail: 识别核心需求、替代选择与持续支付理由。
      metric_refs: []
    - id: q2
      title: 我们靠什么创造不同价值？
      detail: 比较竞争方式、成本结构、商品和服务能力。
      metric_refs: []
    - id: q3
      title: 哪条道路有可成立的投入逻辑？
      detail: 比较资源承诺、机会成本、能力缺口与退出条件。
      metric_refs: []
  hypotheses:
    - id: h1
      statement: 现有店型在目标客群中仍有可持续的价值与扩张空间。
      judgment: 待验证假设
      support: 成熟店型在多个周期的客户价值与经营质量证据。
      counter: 新店边际表现恶化、需求替代或竞争优势无法复制。
      change_condition: 跨周期证据持续反对关键前提时，缩小扩店试点并重新比较道路。
      verified: false
    - id: h2
      statement: 供应链或会员能力建设可能比新增门店带来更可持续的价值。
      judgment: 待验证假设
      support: 能力瓶颈与客户需求证据，以及可检验的改善机制。
      counter: 能力建设成本过高、客户价值不足或难以形成差异。
      change_condition: 试点不能改善关键能力或客户价值时，调整投入安排。
      verified: false
  evidence_plan:
    - id: e1
      name: 客户需求与替代选择
      kind: 客户访谈
      source: 目标客群访谈与购买路径研究
      check: 保留样本边界、原始依据与反例，不把少数访谈当总体事实。
      insufficiency: 样本单一或反证缺失时，只形成待验证判断。
      status: 待获取
    - id: e2
      name: 行业与竞争方式
      kind: 行业研究
      source: 行业资料、竞争活动与公开信息
      check: 核对时间、来源与可比范围，区分公开事实和推测。
      insufficiency: 关键来源冲突时保留不同解释。
      status: 待获取
    - id: e3
      name: 店型与内部能力条件
      kind: 内部数据与业务判断
      source: 不同成熟度门店的跨周期表现及能力盘点
      check: 区分店龄、区域和投入阶段，复核经营口径。
      insufficiency: 没有可比经营周期时，不判定扩店路径成败。
      status: 待获取
  options:
    - id: expand
      name: 选择性继续扩店
      tradeoff: 投入新店、占用资本；需证明既有店型的价值能够复制。
    - id: supply_chain
      name: 优先建设供应链
      tradeoff: 短期能力投入；需验证成本、履约或商品能力的改善机制。
    - id: membership
      name: 优先投入会员经营
      tradeoff: 减少其他投入；需验证目标客户的持续价值与服务能力。
  provenance:
    origin: manual
