  - name: inbound_sell_through_rate
    display_name: 入库售罄率
    type: derived
    definition: >-
      单一产品季，累计零售市值占公司累计采购市值的比例。

      【业务口径】口径与【零售市值】【采购入库市值】一致。截止统计结束时间，限定单一产品季使用，通常用于商品维度分析。

      【关注点】

      1、默认累计零售市值，累计采购入库市值；若取某时间段的零售市值，指标名称需增加后缀。例如：入库售罄率(周)=周间零售市值 / 采购入库市值累计值
      *100%。

      2、由于线下电商仓之间的存在调拨等业务，故此指标不建议区分线下电商使用；若要大致区分线下电商，O2O业绩需算在线下。
    dimensions:
      - brand
      - product
      - category
      - product_season
      - product_year
      - store
    time_grains:
      - week
      - month
    owner_role: 商品负责人
    type_params:
      expr: cumulative_retail_value / purchase_inbound_value
    aggregation:
      allowed_dimensions: []
      disallowed_dimensions:
        - channel
      ratio_policy: recompute_from_parts
    caliber_type:
      - scope_inclusion
    provenance:
      origin: template
      template_ref: apparel-brand-retail@0.1.0
      note: 口径改写自某服饰品牌企业指标字典（2026-09 导出，已脱敏）
