    type: ratio
    definition: |-
      针对单款/款色，覆盖率 = 在手门店数 / 总门店数
      其中在手门店数：（7天或14天内）有零售或有库存的门店数；
      总门店数：当前在营的总门店数；
      【关注点】
      门店数的统计需满足以下3项：
      1.消费者触点为线下门店
      2.运营模式为直营/加盟
      3.渠道类型在（街边店、购物中心、奥特莱斯、百货、超市、母婴、学校）中的门店
    dimensions:
      - brand
      - product
      - category
      - product_season
      - product_year
      - store
    time_grains:
      - week
      - month
    owner_role: 商品负责人
    aggregation:
      allowed_dimensions: []
      disallowed_dimensions: []
      ratio_policy: recompute_from_parts
    caliber_type:
      - validity_threshold
      - scope_inclusion
    provenance:
      origin: template
      template_ref: apparel-brand-retail@0.1.0
      note: 口径改写自某服饰品牌企业指标字典（2026-09 导出，已脱敏）
