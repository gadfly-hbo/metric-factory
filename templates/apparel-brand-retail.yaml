  - name: inventory_turnover_days
    display_name: 库存周转天数
    display_name_en: Inventory Turnover Days
    type: derived
    definition: >-
      企业将当前库存全部售出所需要的天数。

      【业务口径】口径与【库存市值】【零售市值】一致。其中12个月零售市值平均值 = SUM(近12个月累计零售市值) /
      12，不含未结束月；12个月库存市值 平均值= SUM(近12个月的每月期末库存市值 ) / 12。

      【关注点】

      1、计算渠道(电商、加盟、直营)库存周转天数的时候，线下零售市值包含O2O , 电商零售市值不含O2O；

      2、彪马、亚瑟士商品年份的限定条件:商品年份>=所选结束年份-3，其余品牌限定：商品年份 >= 所选结束年份 - 2。
    dimensions:
      - brand
      - product
      - category
      - product_season
      - product_year
      - store
    time_grains:
      - week
      - month
    owner_role: 商品负责人
    caliber_type:
      - scope_inclusion
      - measurement_anchor
    provenance:
      origin: template
      template_ref: apparel-brand-retail@0.1.0
