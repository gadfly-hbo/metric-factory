# 服饰品牌零售 · 行业指标模板
# 来源：某服饰品牌企业真实指标字典（944 指标）精选 72 个，口径经脱敏改写；生成脚本为一次性脚手架，本文件为唯一事实源
template:
  id: apparel-brand-retail
  industry: 服饰品牌零售
  business_models:
    - 直营零售
    - 加盟经销
    - 电商全渠道
  version: 0.1.0
  references:
    - 某服饰品牌企业指标字典（944 指标真实语料，2026-09 导出，脱敏改写）
    - OneData 指标建模方法（阿里）
    - 服装商品管理：售罄率 / OTB / 配发方法论
matching:
  revenue_models:
    - 混合
  user_structure:
    - 2C
  core_loops:
    - 交易
north_star:
  candidates:
    - metric: gmv
      rationale: 全渠道零售规模，同时牵引直营、加盟、电商三盘生意
    - metric: sell_through_rate
      rationale: 商品效率北极星：服装季节性库存的变现速度，库存压力期的首选
  decision_guide: 成长期品牌以 GMV 为规模北极星；库存与商品效率承压时以售罄率为效率北极星；加盟占比高时辅以经销毛利率观察渠道盈利质量
trees:
  - id: retail_scale
    category: 规模
    formula: gmv = traffic * conversion_rate * atv
    children:
      - gmv
      - traffic
      - conversion_rate
      - atv
      - terminal_sales
      - retail_refund_amount
      - retail_sales
      - retail_volume
      - order_count
      - paid_amount
      - store_traffic
      - store_receipts
      - store_conversion
      - upt
      - o2o_sales
      - live_stream_sales
      - new_store_count
      - closed_store_count
      - new_store_sales
  - id: store_productivity
    category: 效率
    children:
      - sales_per_sqm
      - comparable_store_sales
  - id: product_efficiency
    category: 效率
    formula: sell_through_rate = retail_value / (retail_value + inventory_value)
    children:
      - sell_through_rate
      - cumulative_sell_through_rate
      - inbound_sell_through_rate
      - otb_sell_through_rate
      - purchase_sell_through_rate
      - new_product_sell_through_rate
      - inventory_turnover_days
      - coverage_rate
      - tag_price
      - retail_value
      - retail_discount
      - inventory_value
      - on_hand_inventory_value
      - cumulative_retail_value
      - purchase_inbound_value
      - allocation_value
      - net_allocation_value
  - id: member
    category: 旅程
    formula: member_sales_ratio = member_sales / retail_sales
    children:
      - member_sales
      - member_sales_ratio
      - repurchase_rate
      - join_rate
  - id: supply_quality
    category: 质量
    children:
      - batch_achievement_rate
      - delivery_achievement_rate
      - launch_achievement_rate
      - flexible_supply_days
      - market_return_defect_rate
      - supplier_return_defect_rate
      - inbound_pass_rate
      - final_inspection_pass_rate
      - dev_effective_rate
      - cost_deviation_rate
  - id: logistics
    category: 效率
    children:
      - outbound_pieces
      - outbound_orders
      - audit_lead_time
      - outbound_lead_time
      - handover_lead_time
      - ship_lead_time
      - pickup_lead_time
      - pickup_sign_lead_time
      - return_parcel_rate
  - id: finance
    formula: gross_margin = gross_profit / operating_revenue
    children:
      - operating_revenue
      - gross_profit
      - gross_margin
      - total_profit
      - profit_margin
      - expense
      - expense_ratio
      - dealership_revenue
      - dealership_cost
      - dealership_gross_profit
      - dealership_gross_margin
dimensions:
  - brand
  - channel
  - store
  - region
  - category
  - product
  - product_season
  - product_year
  - supplier
  - warehouse
  - member_tier
metrics:
  - name: gmv
    display_name: GMV
    display_name_en: Gross Merchandise Value
    type: simple
    definition: |-
      店铺后台系统销售额统计值及手工录入数据。
      【业务口径】店铺后台未减退款前销售额统计值，包含直营、加盟、电商等。
      【关注点】
      1、直播挂链、官旗O2O业绩归属电商
      2、统计时间按照订单支付时间计算
      3、含视同销售的一次性批发业务
      4、部分特殊渠道（代运营等）的部分店铺用人工维护的方式获取
      5、特卖渠道存在系数还原的特殊口径
      6、仅支持店铺维度
    dimensions:
      - brand
      - channel
      - store
      - region
    time_grains:
      - day
      - week
      - month
    owner_role: 零售业务负责人
    caliber_switches:
      deduct_refund: false
      include_view_as_sale: true
      include_o2o: true
      include_live_stream: true
    caliber_type:
      - refund_adjustment
      - scope_inclusion
    provenance:
      origin: template
      template_ref: apparel-brand-retail@0.1.0
      note: 口径改写自某服饰品牌企业指标字典（2026-09 导出，已脱敏）
  - name: terminal_sales
    display_name: 终端成交额
    type: simple
    definition: |-
      店铺后台系统销售额统计值。
      【业务口径】店铺后台未减退款前销售额统计值，包含直营、加盟、电商等。
      【关注点】
      1、直播挂链、官旗O2O业绩归属电商
      2、统计时间按照订单支付时间计算
      3、含视同销售的一次性批发业务
    dimensions:
      - brand
      - channel
      - store
      - region
    time_grains:
      - day
      - week
      - month
    owner_role: 零售业务负责人
    caliber_type:
      - refund_adjustment
      - scope_inclusion
    provenance:
      origin: template
      template_ref: apparel-brand-retail@0.1.0
      note: 口径改写自某服饰品牌企业指标字典（2026-09 导出，已脱敏）
  - name: retail_refund_amount
    display_name: 零售退款额
    type: simple
    definition: |-
      店铺退款产生的金额。
      【业务口径】包含未发货仅退款额、已发货仅退款额、退货退款额、拒收退货退款额、额外退款额。
      【关注点】
      1、直播挂链、官旗O2O退货业绩归属电商
      2、统计时间按照订单支付时间计算
      3、线下直营/加盟零售的退款归属退货退款
    dimensions:
      - brand
      - channel
      - store
      - region
    time_grains:
      - day
      - week
      - month
    owner_role: 零售业务负责人
    caliber_type:
      - refund_adjustment
    provenance:
      origin: template
      template_ref: apparel-brand-retail@0.1.0
      note: 口径改写自某服饰品牌企业指标字典（2026-09 导出，已脱敏）
  - name: retail_sales
    display_name: 零售额
    type: derived
    definition: |-
      店铺后台系统销售额扣减退款后的实际销售金额。
      【业务口径】口径与【终端成交额】【零售退款额】一致。
    dimensions:
      - brand
      - channel
      - store
      - region
    time_grains:
      - day
      - week
      - month
    owner_role: 零售业务负责人
    type_params:
      expr: terminal_sales - retail_refund_amount
    caliber_type:
      - refund_adjustment
    provenance:
      origin: template
      template_ref: apparel-brand-retail@0.1.0
      note: 口径改写自某服饰品牌企业指标字典（2026-09 导出，已脱敏）
  - name: retail_volume
    display_name: 零售量
    type: simple
    definition: |-
      店铺后台系统销售量扣减退货后的实际销售数量。
      【业务口径】口径与【终端成交量】【零售退款量】一致。
    dimensions:
      - brand
      - channel
      - store
      - region
    time_grains:
      - day
      - week
      - month
    owner_role: 零售业务负责人
    caliber_type:
      - refund_adjustment
    provenance:
      origin: template
      template_ref: apparel-brand-retail@0.1.0
      note: 口径改写自某服饰品牌企业指标字典（2026-09 导出，已脱敏）
  - name: atv
    display_name: 客单价
    display_name_en: Average Transaction Value
    type: ratio
    definition: 线上：支付金额 / 支付买家数；线下：终端成交额 / 订单数。线上线下口径不同，全域汇总时按渠道分别计算后再加总。
    dimensions:
      - brand
      - channel
      - store
      - region
    time_grains:
      - day
      - week
      - month
    owner_role: 零售业务负责人
    aggregation:
      allowed_dimensions: []
      disallowed_dimensions: []
      ratio_policy: recompute_from_parts
    provenance:
      origin: template
      template_ref: apparel-brand-retail@0.1.0
      note: 口径改写自某服饰品牌企业指标字典（2026-09 导出，已脱敏）
  - name: order_count
    display_name: 订单数
    type: simple
    definition: |-
      买家提交的购买需求数，每笔需求里面产品数量不固定。
      【业务口径】买家下单支付产生的订单数量（剔除退货）。
    dimensions:
      - brand
      - channel
      - store
      - region
    time_grains:
      - day
      - week
      - month
    owner_role: 零售业务负责人
    caliber_type:
      - refund_adjustment
    provenance:
      origin: template
      template_ref: apparel-brand-retail@0.1.0
      note: 口径改写自某服饰品牌企业指标字典（2026-09 导出，已脱敏）
  - name: paid_amount
    display_name: 支付金额
    type: simple
    definition: |-
      买家拍下后通过第三方支付等方式支付的金额。
      【业务口径】买家拍下后通过第三方支付等方式支付的金额，未剔除事后退款金额。
      【关注点】
      1、预售阶段付款在付清当天才计入内；
      2、货到付款订单确认收货时计入内。
    dimensions:
      - brand
      - channel
      - store
      - region
    time_grains:
      - day
      - week
      - month
    owner_role: 零售业务负责人
    caliber_type:
      - refund_adjustment
      - measurement_anchor
    provenance:
      origin: template
      template_ref: apparel-brand-retail@0.1.0
      note: 口径改写自某服饰品牌企业指标字典（2026-09 导出，已脱敏）
  - name: traffic
    display_name: 客流量
    type: simple
    definition: |-
      单位时间进入某个场所的人数。
      【业务口径】线下：通过客流计数器统计到的进店人次；
      线上：按日去重的店铺访问人数。
      【关注点】
      1、数据中未筛选线上或线下，则为全域客流量，即线上与线下合计数
    dimensions:
      - brand
      - channel
      - store
      - region
    time_grains:
      - day
      - week
      - month
    owner_role: 零售业务负责人
    provenance:
      origin: template
      template_ref: apparel-brand-retail@0.1.0
      note: 口径改写自某服饰品牌企业指标字典（2026-09 导出，已脱敏）
  - name: conversion_rate
    display_name: 客流转化率
    type: ratio
    definition: |-
      进店客流中，最后能成功下单的比例。
      【业务口径】口径与【订单数】【支付买家数】【客流量】一致。
      【关注点】
      1、计算线上客流转化率时，客流量指线上按日去重的店铺访问人数；计算线下客流转化率时，客流量指通过客流计数器统计到的进店人次。
      2、数据中未筛选线上或线下，则为全域客流量转化率，即（订单数+支付买家数）/（线上客流量+线下客流量）
    dimensions:
      - brand
      - channel
      - store
      - region
    time_grains:
      - day
      - week
      - month
    owner_role: 零售业务负责人
    aggregation:
      allowed_dimensions: []
      disallowed_dimensions: []
      ratio_policy: recompute_from_parts
    provenance:
      origin: template
      template_ref: apparel-brand-retail@0.1.0
      note: 口径改写自某服饰品牌企业指标字典（2026-09 导出，已脱敏）
  - name: store_traffic
    display_name: 门店客流量
    type: simple
    definition: 门店级：线下有客流计数器且门店转化率在1%到50%之间的门店的客流数；汇总级：预估门店客流量=门店订单数/门店转化率
    dimensions:
      - brand
      - channel
      - store
      - region
    time_grains:
      - day
      - week
      - month
    owner_role: 零售业务负责人
    caliber_type:
      - validity_threshold
    provenance:
      origin: template
      template_ref: apparel-brand-retail@0.1.0
      note: 口径改写自某服饰品牌企业指标字典（2026-09 导出，已脱敏）
  - name: store_receipts
    display_name: 门店小票数
    type: simple
    definition: 销售结构为实体门店的小票数汇总（除去退款及退货交易订单）
    dimensions:
      - brand
      - channel
      - store
      - region
    time_grains:
      - day
      - week
      - month
    owner_role: 零售业务负责人
    caliber_type:
      - refund_adjustment
    provenance:
      origin: template
      template_ref: apparel-brand-retail@0.1.0
      note: 口径改写自某服饰品牌企业指标字典（2026-09 导出，已脱敏）
  - name: store_conversion
    display_name: 门店转化率
    type: ratio
    definition: 门店小票数 / 门店客流量
    dimensions:
      - brand
      - channel
      - store
      - region
    time_grains:
      - day
      - week
      - month
    owner_role: 零售业务负责人
    type_params:
      numerator: store_receipts
      denominator: store_traffic
    aggregation:
      allowed_dimensions: []
      disallowed_dimensions: []
      ratio_policy: recompute_from_parts
    provenance:
      origin: template
      template_ref: apparel-brand-retail@0.1.0
      note: 口径改写自某服饰品牌企业指标字典（2026-09 导出，已脱敏）
  - name: upt
    display_name: 门店连带率
    display_name_en: Units Per Transaction
    type: ratio
    definition: 门店零售量 / 门店小票数
    dimensions:
      - brand
      - channel
      - store
      - region
    time_grains:
      - day
      - week
      - month
    owner_role: 零售业务负责人
    type_params:
      numerator: retail_volume
      denominator: store_receipts
    aggregation:
      allowed_dimensions: []
      disallowed_dimensions: []
      ratio_policy: recompute_from_parts
    provenance:
      origin: template
      template_ref: apparel-brand-retail@0.1.0
      note: 口径改写自某服饰品牌企业指标字典（2026-09 导出，已脱敏）
  - name: o2o_sales
    display_name: O2O零售额
    type: simple
    definition: O2O扣减退款后的实际销售金额
      O2O统计口径：接单店铺的消费者触点为“线上门店”且发货仓库的仓库类型为“门店仓”，定义为O2O备注：1、极速退无发货仓库的订单，非O2O2、零售数据分析场景（常用表举例：HANA的全域零售表，自助分析工具的全域汇总销退），
      O2O归属接单店铺，零售数量不包含退货数量3、线下门店商品分析场景，为了进销存数据咬合，线下门店的零售数量需要包含O2O；如果门店仓发货后如果出现退货，有2种退货链路：3.1、退回公司总仓：线下门店的零售数量需要包含O2O发货数量3.2、退回门店仓：线下门店的零售数量需要包含O2O零售数量（O2O零售数量
      = O2O发货数量 - O2O退货数量）
    dimensions:
      - brand
      - channel
      - store
      - region
    time_grains:
      - day
      - week
      - month
    owner_role: 零售业务负责人
    caliber_type:
      - refund_adjustment
      - scope_inclusion
    provenance:
      origin: template
      template_ref: apparel-brand-retail@0.1.0
      note: 口径改写自某服饰品牌企业指标字典（2026-09 导出，已脱敏）
  - name: live_stream_sales
    display_name: 直播挂链零售额
    type: simple
    definition: 直播挂链扣减退款后的实际销售金额
    dimensions:
      - brand
      - channel
      - store
      - region
    time_grains:
      - day
      - week
      - month
    owner_role: 零售业务负责人
    caliber_type:
      - refund_adjustment
    provenance:
      origin: template
      template_ref: apparel-brand-retail@0.1.0
      note: 口径改写自某服饰品牌企业指标字典（2026-09 导出，已脱敏）
  - name: new_store_count
    display_name: 区间新店数
    type: simple
    definition: |-
      在统计时间区间内新开店的数量。
      【关注点】：
      1、新开店定义为门店首次零售时间在统计的时间段内；
      2、门店数量统计渠道类型仅包含购物中心、街边店、奥莱、百货、超市、母婴、学校
    dimensions:
      - brand
      - channel
      - store
      - region
    time_grains:
      - month
      - quarter
    owner_role: 零售业务负责人
    caliber_type:
      - measurement_anchor
      - scope_inclusion
    provenance:
      origin: template
      template_ref: apparel-brand-retail@0.1.0
      note: 口径改写自某服饰品牌企业指标字典（2026-09 导出，已脱敏）
  - name: closed_store_count
    display_name: 区间闭店数
    type: simple
    definition: |-
      在统计时间区间内新闭店的数量。
      【关注点】：
      1、闭店定义为满足以下条件二选一：
      ①门店最后一次产生销售的时间距离统计结束时间超过2个月，视为关店；
      ②门店最后一次产生销售时间在近2个月，且主数据关店时间<=统计结束时间，视为关店。
      2、门店数量统计渠道类型仅包含购物中心、街边店、奥莱、百货、超市、母婴、学校
    dimensions:
      - brand
      - channel
      - store
      - region
    time_grains:
      - month
      - quarter
    owner_role: 零售业务负责人
    caliber_type:
      - validity_threshold
      - scope_inclusion
    provenance:
      origin: template
      template_ref: apparel-brand-retail@0.1.0
      note: 口径改写自某服饰品牌企业指标字典（2026-09 导出，已脱敏）
  - name: new_store_sales
    display_name: 区间新店零售额
    type: simple
    definition: 统计时间区间内新开门店在当前时间区间的零售额。
    dimensions:
      - brand
      - channel
      - store
      - region
    time_grains:
      - month
      - quarter
    owner_role: 零售业务负责人
    provenance:
      origin: template
      template_ref: apparel-brand-retail@0.1.0
