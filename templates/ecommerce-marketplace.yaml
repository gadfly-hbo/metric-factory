# 电商交易平台 · 行业指标模板
# 方法论出处：OneData 指标建模（阿里）、AARRR / 北极星框架（Amplitude Playbook）、OSM / UJM
template:
  id: ecommerce-marketplace
  industry: 电商
  business_models: [交易平台, 品牌 DTC]
  version: 0.1.0
  references:
    - "OneData 指标建模方法（阿里）"
    - "AARRR / 北极星框架（Amplitude Playbook）"
    - "OSM / UJM（目标-策略-度量 / 用户旅程地图）"

matching:
  revenue_models: [交易抽佣, 混合]
  user_structure: [2C, 双边市场]
  core_loops: [交易]

north_star:
  candidates:
    - metric: gmv
      rationale: 交易规模，同时带动供需双边
    - metric: paid_user_count
      rationale: 付费用户规模，质量型北极星的兜底候选
  decision_guide: 交易平台优先 GMV；品牌 DTC 优先复购收入

trees:
  - id: revenue
    category: 规模
    formula: "gmv = uv * cvr * aov"
    children: [uv, cvr, aov]
  - id: user_scale
    category: 规模
    children: [signup_count, activation_rate, paid_user_count, app_dau, new_listing_count]
  - id: monetization
    category: 效率
    formula: "commission_revenue = gmv * take_rate"
    children: [gmv, take_rate]
  - id: quality
    category: 质量
    children: [buy_repeat_rate, retention_30d, refund_rate, return_rate, order_cancel_rate, negative_review_rate, review_rate, avg_rating, out_of_stock_rate, complaint_rate, nps, fulfillment_ok_rate, deliver_avg_days]
  - id: structure
    category: 结构
    children: [new_user_gmv_share, category_top3_gmv_share, seller_top10_gmv_share, new_seller_gmv_share, mobile_gmv_share, paid_traffic_share, cross_category_buy_rate]
  - id: efficiency
    category: 效率
    children: [sell_through_rate, inventory_turnover_days, gmv_per_seller, arpu, marketing_roi, marketing_gmv_share, marketing_spend, subsidy_rate, logistics_cost_per_order, customer_service_cost_per_order]
  - id: journey
    category: 旅程
    children: [search_uv, search_to_detail_cvr, detail_to_cart_rate, cart_to_order_rate, first_order_within_7d_rate, silent_user_share, comeback_rate, session_avg_duration]

dimensions: [channel, category, region, user_tier, platform, seller_tier]

metrics:
  # ============ 规模 ============
  - name: gmv
    display_name: 成交总额
    display_name_en: Gross Merchandise Value
    type: derived
    definition: 统计周期内支付成功订单的金额合计；默认剔除退款订单、不含运费与虚拟赠品
    dimensions: [channel, category, region, user_tier]
    time_grains: [day, week, month]
    owner_role: 电商业务负责人
    caliber_switches:
      include_refund: false
      include_shipping: false
      exclude_inner_channel: true
    type_params:
      expr: "uv * cvr * aov"
    caliber_type:
      - refund_adjustment
      - scope_inclusion
    provenance:
      origin: template
      template_ref: ecommerce-marketplace@0.1.0

  - name: order_count
    display_name: 支付订单数
    type: simple
    definition: 统计周期内支付成功的订单数；默认不含退款订单，一笔订单多次支付只计最终成功一笔
    dimensions: [channel, category, region]
    time_grains: [day, week, month]
    owner_role: 电商业务负责人
    caliber_switches:
      include_refund: false
    caliber_type:
      - refund_adjustment
    provenance:
      origin: template
      template_ref: ecommerce-marketplace@0.1.0

  - name: uv
    display_name: 访客数
    display_name_en: Unique Visitors
    type: simple
    definition: 统计周期内去重访问用户数，按设备与账号联合去重；默认剔除内部渠道与机器流量
    dimensions: [channel, region, platform]
    time_grains: [day, week, month]
    owner_role: 增长负责人
    caliber_switches:
      exclude_inner_channel: true
    caliber_type:
      - scope_inclusion
    provenance:
      origin: template
      template_ref: ecommerce-marketplace@0.1.0

  - name: cvr
    display_name: 下单转化率
    display_name_en: Conversion Rate
    type: ratio
    definition: 下单用户数 / 访客数，衡量流量到订单的转化效率
    dimensions: [channel, region]
    time_grains: [day, week, month]
    owner_role: 增长负责人
    caliber_switches: {}
    type_params:
      numerator: order_user_count
      denominator: uv
    aggregation:
      allowed_dimensions: []
      disallowed_dimensions: []
      ratio_policy: recompute_from_parts
    provenance:
      origin: template
      template_ref: ecommerce-marketplace@0.1.0

  - name: aov
    display_name: 客单价
    display_name_en: Average Order Value
    type: ratio
    definition: 成交总额 / 支付订单数；分子默认剔除退款
    dimensions: [channel, category, user_tier]
    time_grains: [day, week, month]
    owner_role: 电商业务负责人
    caliber_switches:
      include_refund: false
    type_params:
      numerator: gmv
      denominator: order_count
    aggregation:
      allowed_dimensions: []
      disallowed_dimensions: []
      ratio_policy: recompute_from_parts
    caliber_type:
      - refund_adjustment
    provenance:
      origin: template
      template_ref: ecommerce-marketplace@0.1.0

  - name: paid_user_count
    display_name: 付费用户数
    type: simple
    definition: 统计周期内至少完成一笔支付成功的去重用户数
    dimensions: [channel, region, user_tier]
    time_grains: [day, week, month]
    owner_role: 用户运营负责人
    caliber_switches: {}
    provenance:
      origin: template
      template_ref: ecommerce-marketplace@0.1.0

  - name: signup_count
    display_name: 新注册用户数
    type: simple
    definition: 统计周期内完成注册（含第三方授权注册）的去重新用户数；默认剔除注册后未激活的机器账号
    dimensions: [channel, region]
    time_grains: [day, week, month]
    owner_role: 增长负责人
    caliber_switches: {}
    caliber_type:
      - validity_threshold
    provenance:
      origin: template
      template_ref: ecommerce-marketplace@0.1.0

  - name: app_dau
    display_name: 日活跃用户数
    type: simple
    definition: 当日启动 App 或访问站点的去重用户数（活跃 = 至少一次有效访问）
    dimensions: [platform, channel]
    time_grains: [day]
    owner_role: 增长负责人
    caliber_switches: {}
    provenance:
      origin: template
      template_ref: ecommerce-marketplace@0.1.0

  - name: active_seller_count
    display_name: 动销商家数
    type: simple
    definition: 统计周期内至少产生一笔支付成功订单的去重商家数
    dimensions: [category, seller_tier]
    time_grains: [month, quarter]
    owner_role: 平台运营负责人
    caliber_switches: {}
    provenance:
      origin: template
      template_ref: ecommerce-marketplace@0.1.0

  - name: new_listing_count
    display_name: 新上架商品数
    type: simple
    definition: 统计周期内首次上架并通过审核的商品数
    dimensions: [category]
    time_grains: [week, month]
    owner_role: 平台运营负责人
    caliber_switches: {}
    provenance:
      origin: template
      template_ref: ecommerce-marketplace@0.1.0

  - name: search_uv
    display_name: 搜索访客数
    type: simple
    definition: 统计周期内使用站内搜索的去重用户数
    dimensions: [channel, platform]
    time_grains: [day, week, month]
    owner_role: 搜索负责人
    caliber_switches: {}
    provenance:
      origin: template
      template_ref: ecommerce-marketplace@0.1.0

  - name: commission_revenue
    display_name: 佣金收入
    type: derived
    definition: 平台按成交金额与类目佣金率计提的交易佣金收入；分子口径与 GMV 一致（默认剔除退款）
    dimensions: [category]
    time_grains: [month, quarter]
    owner_role: 平台财务负责人
    caliber_switches:
      include_refund: false
    type_params:
      expr: "gmv * take_rate"
    caliber_type:
      - refund_adjustment
    provenance:
      origin: template
      template_ref: ecommerce-marketplace@0.1.0

  - name: order_user_count
    display_name: 下单用户数
    type: simple
    definition: 统计周期内至少完成一笔支付成功的去重用户数（与 paid_user_count 同口径，用于转化率分母场景）
    dimensions: [channel, region]
    time_grains: [day, week, month]
    owner_role: 增长负责人
    caliber_switches: {}
    provenance:
      origin: template
      template_ref: ecommerce-marketplace@0.1.0

  - name: repeat_buyer_count
    display_name: 复购买家数
    type: simple
    definition: 统计周期内下单 ≥2 次的去重用户数（复购率分子）
    dimensions: [channel, user_tier]
    time_grains: [month, quarter]
    owner_role: 用户运营负责人
    caliber_switches: {}
    caliber_type:
      - validity_threshold
    provenance:
      origin: template
      template_ref: ecommerce-marketplace@0.1.0

  - name: marketing_spend
    display_name: 投放费用
    type: simple
    definition: 统计周期内外部渠道投放费用合计（不含平台内部资源位）
    dimensions: [channel]
    time_grains: [month]
    owner_role: 增长负责人
    caliber_switches: {}
    caliber_type:
      - scope_inclusion
    provenance:
      origin: template
      template_ref: ecommerce-marketplace@0.1.0

  # ============ 质量 ============
  - name: buy_repeat_rate
    display_name: 复购率
    type: ratio
    definition: 统计周期内下单 ≥2 次的用户数 / 下单用户数
    dimensions: [channel, user_tier]
    time_grains: [month, quarter]
    owner_role: 用户运营负责人
    caliber_switches: {}
    type_params:
      numerator: repeat_buyer_count
      denominator: order_user_count
    aggregation:
      allowed_dimensions: []
      disallowed_dimensions: []
      ratio_policy: recompute_from_parts
    caliber_type:
      - validity_threshold
    provenance:
      origin: template
      template_ref: ecommerce-marketplace@0.1.0

  - name: retention_30d
    display_name: 30 日留存率
    type: ratio
    definition: 新用户首访后 30 日内再次活跃的用户占比；默认活跃 = 再次访问，可收紧为再次支付
    dimensions: [channel]
    time_grains: [month]
    owner_role: 增长负责人
    caliber_switches:
      active_by_pay: false
    aggregation:
      allowed_dimensions: []
      disallowed_dimensions: []
      ratio_policy: recompute_from_parts
    caliber_type:
      - validity_threshold
    provenance:
      origin: template
      template_ref: ecommerce-marketplace@0.1.0

  - name: refund_rate
    display_name: 退款率
    type: ratio
    definition: 统计周期内退款订单数 / 支付订单数；默认仅统计已完成退款，不含退款中
    dimensions: [category, channel]
    time_grains: [day, week, month]
    owner_role: 电商业务负责人
    caliber_switches:
      include_pending_refund: false
    aggregation:
      allowed_dimensions: []
      disallowed_dimensions: []
      ratio_policy: recompute_from_parts
    caliber_type:
      - refund_adjustment
    provenance:
      origin: template
      template_ref: ecommerce-marketplace@0.1.0

  - name: return_rate
    display_name: 退货率
    type: ratio
    definition: 统计周期内退货订单数 / 支付订单数（退货 = 已发货后退回商品，区别于未发货仅退款）
    dimensions: [category, channel]
    time_grains: [week, month]
    owner_role: 电商业务负责人
    caliber_switches: {}
    aggregation:
      allowed_dimensions: []
      disallowed_dimensions: []
      ratio_policy: recompute_from_parts
    caliber_type:
      - refund_adjustment
    provenance:
      origin: template
      template_ref: ecommerce-marketplace@0.1.0

  - name: order_cancel_rate
    display_name: 订单取消率
    type: ratio
    definition: 统计周期内用户主动取消 + 超时未支付关闭的订单数 / 下单订单数
    dimensions: [channel, category]
    time_grains: [day, week, month]
    owner_role: 电商业务负责人
    caliber_switches: {}
    aggregation:
      allowed_dimensions: []
      disallowed_dimensions: []
      ratio_policy: recompute_from_parts
    provenance:
      origin: template
      template_ref: ecommerce-marketplace@0.1.0

  - name: negative_review_rate
    display_name: 差评率
    type: ratio
    definition: 统计周期内 1–2 星评价数 / 有效评价数
    dimensions: [category]
    time_grains: [week, month]
    owner_role: 商品质量负责人
    caliber_switches: {}
    aggregation:
      allowed_dimensions: []
      disallowed_dimensions: []
      ratio_policy: recompute_from_parts
    caliber_type:
      - validity_threshold
    provenance:
      origin: template
      template_ref: ecommerce-marketplace@0.1.0

  - name: review_rate
    display_name: 评价率
    type: ratio
    definition: 统计周期内已评价订单数 / 确认收货订单数
    dimensions: [category]
    time_grains: [month]
    owner_role: 商品质量负责人
    caliber_switches: {}
    aggregation:
      allowed_dimensions: []
      disallowed_dimensions: []
      ratio_policy: recompute_from_parts
    provenance:
      origin: template
      template_ref: ecommerce-marketplace@0.1.0

  - name: avg_rating
    display_name: 平均评分
    type: simple
    definition: 统计周期内有效评价的算术平均星级（1–5）
    dimensions: [category]
    time_grains: [month]
    owner_role: 商品质量负责人
    caliber_switches: {}
    provenance:
      origin: template
      template_ref: ecommerce-marketplace@0.1.0

  - name: fulfillment_ok_rate
    display_name: 履约准时率
    type: ratio
    definition: 按承诺发货时间准时发货的订单数 / 应发货订单数
    dimensions: [category, region]
    time_grains: [week, month]
    owner_role: 供应链负责人
    caliber_switches: {}
    aggregation:
      allowed_dimensions: []
      disallowed_dimensions: []
      ratio_policy: recompute_from_parts
    caliber_type:
      - measurement_anchor
    provenance:
      origin: template
      template_ref: ecommerce-marketplace@0.1.0

  - name: deliver_avg_days
    display_name: 平均到货时长
    display_name_en: Average Delivery Days
    type: simple
    definition: 支付成功到确认收货的平均自然日天数
    dimensions: [region, category]
    time_grains: [month]
    owner_role: 供应链负责人
    caliber_switches: {}
    caliber_type:
      - measurement_anchor
    provenance:
      origin: template
      template_ref: ecommerce-marketplace@0.1.0

  - name: out_of_stock_rate
    display_name: 缺货率
    type: ratio
    definition: 统计周期内因库存不足导致的不可售商品曝光次数 / 商品总曝光次数
    dimensions: [category, seller_tier]
    time_grains: [week, month]
    owner_role: 供应链负责人
    caliber_switches: {}
    aggregation:
      allowed_dimensions: []
      disallowed_dimensions: []
      ratio_policy: recompute_from_parts
    provenance:
      origin: template
      template_ref: ecommerce-marketplace@0.1.0

  - name: complaint_rate
    display_name: 客诉率
    type: ratio
    definition: 统计周期内发起客诉的订单数 / 支付订单数
    dimensions: [channel, category]
    time_grains: [month]
    owner_role: 客服负责人
    caliber_switches: {}
    aggregation:
      allowed_dimensions: []
      disallowed_dimensions: []
      ratio_policy: recompute_from_parts
    provenance:
      origin: template
      template_ref: ecommerce-marketplace@0.1.0

  - name: nps
    display_name: 净推荐值
    display_name_en: Net Promoter Score
    type: simple
    definition: 推荐者占比（9–10 分）− 贬损者占比（0–6 分），基于周期性调研问卷
    dimensions: [user_tier]
    time_grains: [quarter]
    owner_role: 用户运营负责人
    caliber_switches: {}
    provenance:
      origin: template
      template_ref: ecommerce-marketplace@0.1.0

  # ============ 结构 ============
  - name: new_user_gmv_share
    display_name: 新客 GMV 占比
    type: ratio
    definition: 新客（统计周期内首次购买用户）贡献 GMV / 全站 GMV，衡量增长对拉新的依赖度
    dimensions: [channel]
    time_grains: [month, quarter]
    owner_role: 增长负责人
    caliber_switches: {}
    aggregation:
      allowed_dimensions: []
      disallowed_dimensions: []
      ratio_policy: recompute_from_parts
    caliber_type:
      - scope_inclusion
    provenance:
      origin: template
      template_ref: ecommerce-marketplace@0.1.0

  - name: category_top3_gmv_share
    display_name: TOP3 品类 GMV 集中度
    type: ratio
    definition: GMV 最高的三个品类合计占比，衡量品类结构分散度
    dimensions: [region]
    time_grains: [month, quarter]
    owner_role: 平台运营负责人
    caliber_switches: {}
    aggregation:
      allowed_dimensions: []
      disallowed_dimensions: []
      ratio_policy: recompute_from_parts
    provenance:
      origin: template
      template_ref: ecommerce-marketplace@0.1.0

  - name: seller_top10_gmv_share
    display_name: 头部商家集中度
    type: ratio
    definition: GMV 前 10 名商家合计 GMV / 全站 GMV，衡量供给侧对头部商家的依赖
    dimensions: [category]
    time_grains: [month, quarter]
    owner_role: 平台运营负责人
    caliber_switches: {}
    aggregation:
      allowed_dimensions: []
      disallowed_dimensions: []
      ratio_policy: recompute_from_parts
    provenance:
      origin: template
      template_ref: ecommerce-marketplace@0.1.0

  - name: new_seller_gmv_share
    display_name: 新商家 GMV 占比
    type: ratio
    definition: 入驻 90 日内商家的 GMV / 全站 GMV，衡量供给侧新鲜度
    dimensions: [category]
    time_grains: [month, quarter]
    owner_role: 平台运营负责人
    caliber_switches: {}
    aggregation:
      allowed_dimensions: []
      disallowed_dimensions: []
      ratio_policy: recompute_from_parts
    caliber_type:
      - scope_inclusion
    provenance:
      origin: template
      template_ref: ecommerce-marketplace@0.1.0

  - name: mobile_gmv_share
    display_name: 移动端 GMV 占比
    type: ratio
    definition: 移动端（App + 移动 Web）GMV / 全站 GMV
    dimensions: [region, category]
    time_grains: [month]
    owner_role: 增长负责人
    caliber_switches: {}
    aggregation:
      allowed_dimensions: []
      disallowed_dimensions: []
      ratio_policy: recompute_from_parts
    caliber_type:
      - scope_inclusion
    provenance:
      origin: template
      template_ref: ecommerce-marketplace@0.1.0

  - name: paid_traffic_share
    display_name: 付费流量占比
    type: ratio
    definition: 付费渠道（投放入口）带来的访问量 / 总访问量
    dimensions: [platform]
    time_grains: [month]
    owner_role: 增长负责人
    caliber_switches: {}
    aggregation:
      allowed_dimensions: []
      disallowed_dimensions: []
      ratio_policy: recompute_from_parts
    provenance:
      origin: template
      template_ref: ecommerce-marketplace@0.1.0

  - name: cross_category_buy_rate
    display_name: 跨品类购买率
    type: ratio
    definition: 统计周期内购买 ≥2 个品类商品的用户数 / 购买用户数
    dimensions: [user_tier]
    time_grains: [month, quarter]
    owner_role: 用户运营负责人
    caliber_switches: {}
    aggregation:
      allowed_dimensions: []
      disallowed_dimensions: []
      ratio_policy: recompute_from_parts
    caliber_type:
      - validity_threshold
    provenance:
      origin: template
      template_ref: ecommerce-marketplace@0.1.0

  # ============ 效率 ============
  - name: sell_through_rate
    display_name: 动销率
    type: ratio
    definition: 统计周期内产生销售的商品数（SKU）/ 在架商品数
    dimensions: [category, seller_tier]
    time_grains: [month]
    owner_role: 平台运营负责人
    caliber_switches: {}
    aggregation:
      allowed_dimensions: []
      disallowed_dimensions: []
      ratio_policy: recompute_from_parts
    provenance:
      origin: template
      template_ref: ecommerce-marketplace@0.1.0

  - name: inventory_turnover_days
    display_name: 库存周转天数
    type: simple
